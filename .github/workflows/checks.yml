name: Public Film Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      BANANA_DATA: /tmp/banana-film-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow numpy IPython
      - name: Install media test tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python tools/build_film_notebook.py
      - run: git diff --exit-code -- Banana_Film_Studio.ipynb
      - run: python -m compileall -q banana_mv tools
      - run: python -m unittest discover -s tests
      - run: node tests/check_film_ui.cjs
      - run: node tests/check_ui.cjs
      - name: Install browser test driver
        run: npm install --no-save playwright@1.56.1
      - name: Real Chromium input and mention checks
        run: node tests/check_film_browser.cjs
