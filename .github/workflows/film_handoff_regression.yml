name: BANANA FILM Shot Handoff Regression

on:
  push:
    branches:
      - fix/film-5070-shot-handoff-20261113
      - film-v2-rtx5070-fdrive
    paths:
      - 'banana_mv/film_manual.py'
      - 'banana_mv/timed_slots.py'
      - 'banana_mv/film_continuity.py'
      - 'banana_mv/film_media.py'
      - 'tests/test_film_shot_handoff.py'
      - 'banana_mv/web/film_review.js'
      - 'banana_mv/web/film.html'
      - 'tests/check_film_ui.cjs'
      - 'banana_mv/takes.py'
      - 'banana_mv/film.py'
      - '.github/workflows/film_handoff_regression.yml'
  pull_request:
    paths:
      - 'banana_mv/film_manual.py'
      - 'banana_mv/timed_slots.py'
      - 'tests/test_film_shot_handoff.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authored-shot-and-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tiny offline dependencies
        run: python -m pip install Pillow
      - name: Syntax
        run: python -m compileall -q banana_mv/film_manual.py banana_mv/timed_slots.py banana_mv/film_continuity.py banana_mv/film_media.py
      - name: Film kitchen UI, direct prompt and selected version retakes
        run: node tests/check_film_ui.cjs
      - name: 30s shot handoff, spoken dialogue, music template, and 5-frame audio alignment
        env:
          BANANA_DATA: /tmp/banana-film-handoff-ci
        run: python -m unittest discover -s tests -p 'test_film_shot_handoff.py' -v
