<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>蕉彌鐵板燒｜蕉宗一鍵短片</title>
  <link rel="stylesheet" href="teppan.css?v=jiaomi-prototype">
  <script defer src="teppan.js?v=jiaomi-estimate"></script>
</head>
<body>
  <header class="bar">
    <a href="./" class="back">← 一鍵短片</a>
    <button id="new-project" type="button" class="quiet" hidden>新開一桌</button>
  </header>
  <main>
    <section class="counter" id="counter" data-phase="idle" aria-labelledby="title">
      <div class="counter-copy">
        <h1 id="title">蕉彌鐵板燒</h1>
        <p id="project-title" hidden></p>
        <p id="status" role="status">鐵板就位，等你的第一道菜單。</p>
        <progress id="progress" aria-label="本次片段完成進度" hidden></progress>
        <div id="comfy-progress" hidden>
          <p id="comfy-stage" role="status"></p>
          <progress id="comfy-count" aria-labelledby="comfy-stage" hidden></progress>
        </div>
      </div>
      <div class="stage" aria-hidden="true">
        <svg viewBox="0 0 210 172" class="chef">
          <ellipse cx="110" cy="149" rx="89" ry="13" fill="#46291e"/>
          <g class="chef-motion">
            <g class="tail">
              <path d="M98 122q28 8 30-14 1-11-7-15" fill="none" stroke="#f2dc84" stroke-width="7" stroke-linecap="round"/>
              <g transform="translate(121 90) rotate(-18)">
                <ellipse cx="-4" cy="4" rx="3.6" ry="7" fill="#f5e3a0" stroke="#c9a64c" stroke-width="1"/>
                <ellipse cx="1" cy="5" rx="3.6" ry="7" fill="#f5e3a0" stroke="#c9a64c" stroke-width="1"/>
                <ellipse cx="6" cy="4" rx="3.6" ry="7" fill="#f5e3a0" stroke="#c9a64c" stroke-width="1"/>
                <path d="M-11 2q11-15 24-2 2 3-2 4-10-7-20 2Z" fill="#5e7a3a" stroke="#3f5527" stroke-width="1"/>
                <path d="M-8 1q9-8 19-1" fill="none" stroke="#9db86a" stroke-width=".8"/>
              </g>
            </g>
            <path d="M58 84Q49 100 53 132h50q4-32-5-48Z" fill="#f2dc84" stroke="#c9a64c" stroke-width="1.5"/>
            <ellipse cx="78" cy="113" rx="16" ry="18" fill="#f7ecd4"/>
            <path d="M76.5 120q1.5 2 3 0" fill="none" stroke="#d9c3a3" stroke-width="1.2" stroke-linecap="round"/>
            <g class="ears">
              <path d="M57 60C45 61 37 75 38 90c2 7 10 4 14-4 5-8 7-15 7-20Z" fill="#f2dc84" stroke="#c9a64c" stroke-width="1.3"/>
              <path d="M53 66c-7 3-11 12-10 20 3 1 6-3 8-8 2-5 3-9 2-12Z" fill="#eba7a0"/>
              <path d="M99 60c12 1 20 15 19 30-2 7-10 4-14-4-5-8-7-15-7-20Z" fill="#f2dc84" stroke="#c9a64c" stroke-width="1.3"/>
              <path d="M103 66c7 3 11 12 10 20-3 1-6-3-8-8-2-5-3-9-2-12Z" fill="#eba7a0"/>
            </g>
            <path d="M54 78C49 56 62 38 72 26q5-8 7-17l10 2q-2 10 3 21c11 17 16 33 10 46Q78 90 54 78Z" fill="#f2dc84" stroke="#c9a64c" stroke-width="1.6"/>
            <path d="M79 9l2-6 9 2-1 6Z" fill="#6b4128"/>
            <path d="M84 14q-1 14 6 26" fill="none" stroke="#dcc06a" stroke-width="1.2" stroke-linecap="round"/>
            <ellipse cx="78" cy="69" rx="22" ry="17" fill="#f7ecd4"/>
            <path d="M78 53c-4.5 0-4.5-6.5 0-6.5 3.5 0 3.5 4.5.2 4.5-2 0-2-2.5-.2-2.5M78 46.5v-4m-2 1.5 2-2 2 2" fill="none" stroke="#d4a537" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <ellipse cx="66" cy="74" rx="4.2" ry="2.6" fill="#f0a99a" opacity=".75"/>
            <ellipse cx="90" cy="74" rx="4.2" ry="2.6" fill="#f0a99a" opacity=".75"/>
            <path d="M76.6 71.5h2.8l-1.4 1.6Z" fill="#d98a86"/>
            <g class="smile-face" fill="none" stroke="#5a3f2c" stroke-linecap="round">
              <path d="M66 67q3.5-3.5 7 0m10 0q3.5-3.5 7 0" stroke-width="2"/>
              <path d="M75 75q1.5 2 3 0 1.5 2 3 0" stroke-width="1.3"/>
            </g>
            <g class="surprise-face">
              <ellipse cx="69.5" cy="66" rx="3.6" ry="4.6" fill="#fff7e7" stroke="#5a3f2c" stroke-width="1"/>
              <ellipse cx="86.5" cy="66" rx="3.6" ry="4.6" fill="#fff7e7" stroke="#5a3f2c" stroke-width="1"/>
              <circle cx="70" cy="67" r="1.8" fill="#5a3f2c"/>
              <circle cx="86" cy="67" r="1.8" fill="#5a3f2c"/>
              <ellipse cx="78" cy="77" rx="2.4" ry="3" fill="#5a3f2c"/>
            </g>
            <g class="gassho">
              <path d="M60 90q6 13 16 9m20-9q-6 13-16 9" fill="none" stroke="#c9a64c" stroke-width="10" stroke-linecap="round"/>
              <path d="M60 90q6 13 16 9m20-9q-6 13-16 9" fill="none" stroke="#f2dc84" stroke-width="7.5" stroke-linecap="round"/>
              <path d="M72.5 103q-1.5-12 5.5-19 7 7 5.5 19-5.5 3.5-11 0Z" fill="#7a5236" stroke="#5c3d28" stroke-width=".8"/>
              <path d="M78 85v18" stroke="#5c3d28" stroke-width="1"/>
            </g>
            <g class="work-pose">
              <path d="M59 92q-8 11-3 22" fill="none" stroke="#c9a64c" stroke-width="10" stroke-linecap="round"/><path d="M59 92q-8 11-3 22" fill="none" stroke="#f2dc84" stroke-width="7.5" stroke-linecap="round"/>
              <ellipse cx="57" cy="115" rx="4" ry="3.4" fill="#7a5236"/>
              <g class="spatula">
                <path d="M97 92q12 2 21 11" fill="none" stroke="#c9a64c" stroke-width="10" stroke-linecap="round"/><path d="M97 92q12 2 21 11" fill="none" stroke="#f2dc84" stroke-width="7.5" stroke-linecap="round"/>
                <path d="m118 103 29 18" stroke="#593e34" stroke-width="4.5" stroke-linecap="round"/>
                <path d="m143 116 19 6 6 12-21-6Z" fill="#e0d3b5" stroke="#866f57" stroke-width="2"/>
                <ellipse cx="119" cy="104" rx="4.4" ry="3.8" fill="#7a5236"/>
              </g>
            </g>
          </g>
          <g class="flames">
            <path d="M108 137q-10-9-2-22 0 7 4 8 7-6 5-20 15 11 14 26 5-2 6-9 7 13-2 17Z" fill="#e36b34"/>
            <path d="M122 137q-7-8-2-17 1 6 5 7 4-3 5-8 6 12 0 18Z" fill="#ffd47a"/>
          </g>
          <path d="M22 132h163l15 14H8Z" fill="#665344"/>
          <path d="M8 146h192v13H8Z" fill="#382e28"/>
          <path d="M18 145h170" stroke="#df9970" stroke-width="2"/>
          <g class="ingredients">
            <circle cx="148" cy="131" r="4" fill="#d87540"/>
            <rect x="157" y="126" width="8" height="5" rx="2" fill="#aabe71"/>
            <circle cx="171" cy="130" r="3" fill="#ffdc87"/>
          </g>
          <g class="steam" fill="none" stroke="#fae5bf" stroke-width="3" stroke-linecap="round">
            <path d="M146 129q-10-8-1-17t0-15"/>
            <path d="M163 129q-8-6 1-15t0-15"/>
            <path d="M179 129q-9-8 1-19"/>
          </g>
        </svg>
      </div>
    </section>

    <label id="restore-wrap" class="restore" hidden>繼續之前的專案
      <select id="restore-project"><option value="">選擇專案</option></select>
    </label>

    <form id="menu-form">
      <div id="shared-setup">
        <label for="shared">共同設定（選填）</label>
        <textarea id="shared" rows="3" maxlength="12000" aria-describedby="shared-help" aria-controls="shared-image-list" aria-autocomplete="list" placeholder="角色、聲線與畫風。輸入 @ 選參考圖。"></textarea>
        <div id="shared-image-suggestions" class="image-suggestions" hidden>
          <div id="shared-image-list" class="image-list" role="listbox" aria-label="共同設定參考圖片"></div>
          <p id="shared-image-empty" class="image-empty" role="status" hidden></p>
          <button id="shared-image-add" class="quiet image-add" type="button" hidden>選擇參考圖</button>
        </div>
        <p id="shared-help">開案時填一次，後續每道菜都會沿用。</p>
      </div>
      <details id="settings">
        <summary>設定 <span id="profile">480P · 6 步 · 10 秒 · Thinking</span></summary>
        <div class="settings-body">
          <div id="initial-settings">
            <label>專案名稱<input id="name" maxlength="120" placeholder="選填"></label>
            <div class="settings-grid">
              <label>生成解析度<select id="resolution"><option value="480">480P</option><option value="720">720P</option></select></label>
              <label>採樣步數<select id="steps"><option value="6">6 步</option><option value="8">8 步</option></select></label>
              <label>畫面比例<select id="aspect"><option>16:9</option><option>9:16</option><option>4:5</option><option>1:1</option></select></label>
              <label>聲音<select id="sound"><option value="auto">依菜單</option><option value="dialogue">對白</option><option value="ambient">環境聲</option></select></label>
            </div>
            <label class="check"><input type="checkbox" id="thinking" checked> 9B Thinking（16K）</label>
            <fieldset><legend>參考圖</legend><div id="references"></div></fieldset>
          </div>
          <label>這道菜的秒數<select id="seconds"><option value="auto" selected>蕉彌估算</option><option value="6">6 秒</option><option value="10">10 秒</option><option value="20">20 秒</option><option value="30">30 秒</option><option value="60">60 秒</option></select></label>
        </div>
      </details>
      <div class="menu-composer">
        <div class="composer-header">
          <label id="menu-label" for="menu">第一道菜單</label>
          <button id="expand-menu" class="quiet" type="button" aria-expanded="false" aria-controls="menu">拉開輸入框</button>
        </div>
        <textarea id="menu" rows="3" maxlength="30000" aria-controls="menu-image-list" aria-autocomplete="list" placeholder="寫下這一段要發生的事。輸入 @ 選參考圖。" required></textarea>
        <div id="menu-image-suggestions" class="image-suggestions" hidden>
          <div id="menu-image-list" class="image-list" role="listbox" aria-label="參考圖片"></div>
          <p id="menu-image-empty" class="image-empty" role="status" hidden></p>
          <button id="menu-image-add" class="quiet image-add" type="button" hidden>選擇參考圖</button>
        </div>
        <p id="estimate" class="estimate" role="status" aria-live="polite" hidden></p>
        <div class="composer-actions">
          <button id="edit-dish" class="quiet" type="button" hidden>修改這道菜</button>
          <button id="resume" class="quiet" type="button" hidden>繼續製作</button>
          <button id="stop" class="quiet" type="button" hidden>緊急停爐</button>
          <button id="cook" type="submit">開始炒菜</button>
        </div>
      </div>
    </form>
    <p id="feedback" role="status"></p>
    <div id="dishes"></div>
    <section id="served" class="dish" hidden aria-label="成片"></section>
    <section id="service" hidden>
      <label class="check"><input id="upscale" type="checkbox" checked> 上菜後升頻至 2K</label>
      <button id="serve" type="button">上菜</button>
    </section>
  </main>
</body>
</html>
